<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Passat GTE Ladehistorie</title>
    <!-- SheetJS for .xlsx parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 0 0 40px 0;
            min-height: 100vh;
        }
        .app-header {
            background: linear-gradient(145deg, #003d6b 0%, #0066b3 100%);
            padding: 12px 18px 10px 18px;
            box-shadow: 0 4px 20px rgba(0, 60, 120, 0.4);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left .car-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .header-left .car-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        .header-left .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }
        .header-left .title small {
            display: block;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }
        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .import-btn, .action-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
        .import-btn:hover, .action-btn:hover {
            background: rgba(255, 255, 255, 0.30);
        }
        .import-btn svg, .action-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }
        .action-btn.danger {
            background: rgba(234, 67, 53, 0.35);
        }
        .action-btn.danger:hover {
            background: rgba(234, 67, 53, 0.55);
        }
        #fileInput, #schaefflerFileInput, #restoreInput { display: none; }

        .token-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
        }
        .token-row label {
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .token-row input {
            flex: 1;
            min-width: 120px;
            padding: 3px 8px;
            border: none;
            border-radius: 30px;
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            outline: none;
            transition: background 0.2s;
        }
        .token-row input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .token-row input:focus {
            background: rgba(255,255,255,0.25);
        }
        .token-row .save-status {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
        }
        .token-row .save-status.ok { color: #34a853; }
        .token-row .save-status.err { color: #ea4335; }
        .token-row .save-status.sync { color: #fbbc04; }

        .summary-card {
            background: #fff;
            margin: 14px 16px 10px 16px;
            padding: 16px 18px 14px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .summary-label {
            font-size: 12px;
            font-weight: 500;
            color: #6b7a8a;
            letter-spacing: 0.2px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 2px;
        }
        .summary-total-kwh {
            font-size: 28px;
            font-weight: 700;
            color: #003d6b;
        }
        .summary-total-kwh small {
            font-size: 16px;
            font-weight: 500;
            color: #6b7a8a;
            margin-left: 4px;
        }
        .summary-cost {
            font-size: 18px;
            font-weight: 600;
            color: #003d6b;
        }
        .summary-cost small {
            font-size: 13px;
            font-weight: 400;
            color: #6b7a8a;
            margin-left: 2px;
        }
        .summary-detail {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 13px;
            color: #4a5a6a;
            border-top: 1px solid #ecf0f3;
            padding-top: 6px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .summary-detail .status { color: #6b7a8a; font-size: 11px; }

        .month-nav-card {
            background: #fff;
            margin: 0 16px 10px 16px;
            padding: 14px 18px 12px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .month-nav .nav-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #0066b3;
            cursor: pointer;
            padding: 0 10px;
            line-height: 1;
            touch-action: manipulation;
            transition: opacity 0.2s;
        }
        .month-nav .nav-btn:active { opacity: 0.5; }
        .month-nav .month-title {
            font-size: 18px;
            font-weight: 700;
            color: #003d6b;
        }
        .month-nav .month-title .year {
            font-weight: 400;
            font-size: 14px;
            color: #6b7a8a;
        }
        .month-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 2px 0;
        }
        .month-stat-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 13px;
            color: #2c3e50;
        }
        .month-stat-item .stat-value {
            font-weight: 700;
            font-size: 16px;
            color: #003d6b;
        }
        .month-stat-item .stat-label {
            color: #8a9aa8;
            font-size: 12px;
        }
        .month-session-count {
            font-size: 12px;
            color: #6b7a8a;
            margin-top: 4px;
            border-top: 1px solid #ecf0f3;
            padding-top: 6px;
        }

        .chart-container {
            margin-top: 10px;
            border-top: 1px solid #ecf0f3;
            padding-top: 10px;
        }
        .chart-title {
            font-size: 12px;
            font-weight: 500;
            color: #6b7a8a;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }
        .chart-bars-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            height: 90px;
            min-width: 100%;
            gap: 2px;
            flex-wrap: nowrap;
        }
        .chart-day {
            flex: 1 0 0;
            min-width: 6px;
            height: 100%;
            display: flex;
            align-items: flex-end;
            gap: 1px;
        }
        .chart-bar {
            flex: 1 0 0;
            min-width: 2px;
            border-radius: 2px 2px 0 0;
            transition: height 0.2s;
            min-height: 2px;
            position: relative;
            background: #0066b3;
        }
        .chart-bar.fuel { background: #ea4335; }
        .chart-bar.schaeffler { background: #34a853; }
        .chart-bar.zero { background: #e9ecef; }
        .chart-bar:hover { opacity: 0.8; }
        .chart-legend {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #6b7a8a;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .chart-legend span { display: flex; align-items: center; gap: 4px; }
        .chart-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .chart-legend .dot.energy { background: #0066b3; }
        .chart-legend .dot.fuel { background: #ea4335; }
        .chart-legend .dot.schaeffler { background: #34a853; }
        .chart-labels {
            display: flex;
            margin-top: 2px;
            font-size: 7px;
            color: #8a9aa8;
            justify-content: space-between;
            padding: 0 2px;
        }
        .chart-labels span {
            flex: 1;
            text-align: center;
            transform: rotate(-45deg);
            white-space: nowrap;
            font-size: 6px;
        }

        .session-list {
            margin: 0 16px 10px 16px;
        }
        .session-item {
            background: #fff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 6px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-left: 4px solid #0066b3;
        }
        .session-item.fuel { border-left-color: #ea4335; }
        .session-item.schaeffler { border-left-color: #34a853; }
        .session-item .session-delete {
            background: none;
            border: none;
            color: #c7d0d8;
            font-size: 16px;
            cursor: pointer;
            padding: 0 0 0 8px;
            line-height: 1;
        }
        .session-item .session-delete:hover { color: #ea4335; }
        .session-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-date {
            font-size: 13px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .session-row3 {
            font-size: 11px;
            color: #8a9aa8;
            margin-top: 2px;
        }
        .session-cost {
            font-size: 14px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-duration {
            font-size: 13px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .session-energy {
            font-size: 14px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-energy small {
            font-weight: 400;
            color: #8a9aa8;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8a9aa8;
        }
        .empty-state .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
        }
        .empty-state .hint-btn {
            margin-top: 14px;
            background: #0066b3;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2e3a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 30;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 30, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            padding: 20px;
        }
        .modal-overlay[hidden] { display: none; }
        .modal-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .modal-card h3 {
            font-size: 16px;
            color: #003d6b;
            margin-bottom: 14px;
        }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }
        .modal-field label {
            font-size: 12px;
            color: #6b7a8a;
            font-weight: 500;
        }
        .modal-field input {
            padding: 8px 10px;
            border: 1px solid #dbe3ea;
            border-radius: 8px;
            font-size: 14px;
            color: #2c3e50;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 6px;
        }
        .modal-actions button {
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .modal-actions .btn-cancel { background: #eef1f4; color: #4a5a6a; }
        .modal-actions .btn-save { background: #ea4335; color: #fff; }

        @media (max-width: 500px) {
            .header-left .title { font-size: 14px; }
            .summary-total-kwh { font-size: 24px; }
            .summary-cost { font-size: 16px; }
            .month-nav .month-title { font-size: 16px; }
            .chart-bar { min-width: 4px; }
            .chart-labels span { font-size: 5px; }
            .header-actions .action-btn span { display: none; }
            .header-actions .action-btn { padding: 4px 8px; }
            .token-row input { min-width: 80px; font-size: 10px; }
            .token-row label { font-size: 9px; }
        }
        @media (min-width: 600px) {
            body { max-width: 480px; margin: 0 auto; background: #e8ecf0; }
        }
        ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <div class="car-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
                    </svg>
                </div>
                <div class="title">
                    Passat GTE
                    <small>Ladehistorie · Zuhause & Schaeffler</small>
                </div>
            </div>
            <div class="header-actions">
                <button class="import-btn" id="headerImportBtn">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <span>Import</span>
                </button>
                <button class="action-btn" id="schaefflerImportBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                    <span>Schaeffler</span>
                </button>
                <button class="action-btn" id="fuelBtn">
                    <svg viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 9H6V5h6v4zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                    <span>Tanken</span>
                </button>
                <button class="action-btn" id="backupBtn">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <span>Backup</span>
                </button>
                <button class="action-btn" id="restoreBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    <span>Wiederherstellen</span>
                </button>
                <button class="action-btn" id="githubSaveBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12 0 5.302 3.438 9.8 8.205 11.387.6.113.82-.26.82-.58 0-.287-.01-1.05-.015-2.06-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.3-.535-1.52.117-3.16 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.399 3-.399 1.02 0 2.04.132 3 .399 2.29-1.552 3.297-1.23 3.297-1.23.653 1.64.24 2.86.118 3.16.768.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.62-5.476 5.92.43.37.824 1.102.824 2.22 0 1.602-.015 2.894-.015 3.287 0 .322.216.698.825.578C20.565 21.795 24 17.298 24 12c0-6.627-5.373-12-12-12z"/></svg>
                    <span>GitHub</span>
                </button>
                <button class="action-btn danger" id="clearBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    <span>Leeren</span>
                </button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" multiple />
                <input type="file" id="schaefflerFileInput" accept=".csv" multiple />
                <input type="file" id="restoreInput" accept=".json" />
            </div>
        </div>

        <!-- Token-Zeile – minimal -->
        <div class="token-row">
            <label>🔑 Token</label>
            <input type="password" id="githubToken" placeholder="ghp_..." />
            <span class="save-status" id="saveStatus">● bereit</span>
        </div>
    </header>

    <div id="toast" class="toast"></div>

    <div id="fuelModal" class="modal-overlay" hidden>
        <div class="modal-card">
            <h3>⛽ Tankfüllung eintragen</h3>
            <form id="fuelForm">
                <div class="modal-field">
                    <label for="fuelDate">Datum</label>
                    <input type="date" id="fuelDate" required />
                </div>
                <div class="modal-field">
                    <label for="fuelLiters">Menge (Liter)</label>
                    <input type="number" id="fuelLiters" step="0.01" min="0.01" placeholder="z. B. 32.5" required />
                </div>
                <div class="modal-field">
                    <label for="fuelPrice">Preis pro Liter (€)</label>
                    <input type="number" id="fuelPrice" step="0.001" min="0.001" placeholder="z. B. 1.699" required />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="fuelCancelBtn">Abbrechen</button>
                    <button type="submit" class="btn-save">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <main id="appContent">
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🚗</div>
            <h3>Keine Ladedaten</h3>
            <p>Importiere eine oder mehrere <br /><strong>.xlsx</strong>-Dateien im GTE-Format.</p>
            <button class="hint-btn" id="emptyImportBtn">Datei importieren</button>
        </div>
        <div id="dataContainer"></div>
    </main>

    <script>
        // ============================================================
        // KONSTANTEN & ZUSTAND
        // ============================================================
        const COST_PER_KWH = 0.267;
        const GITHUB_REPO = 'acendrion1984/Passat';
        const GITHUB_PATH = 'ladedaten.json';
        const DATA_URL = 'ladedaten.json';
        const FUEL_GITHUB_PATH = 'tankdaten.json';
        const FUEL_DATA_URL = 'tankdaten.json';
        const SCHAEFFLER_GITHUB_PATH = 'schaefflerdaten.json';
        const SCHAEFFLER_DATA_URL = 'schaefflerdaten.json';
        // Werte über diesem Schwellwert (kWh) sind ein bekannter Faktor-10-
        // Messfehler des Zählers und werden durch 10 geteilt. 11.14 ist der
        // höchste beobachtete plausible Vollladewert; alles darüber (50+) sind
        // die echten Ausreißer.
        const ENERGY_FIX_THRESHOLD = 11.14;
        const DEDUPE_WINDOW_MS = 120000; // 2 Minuten

        let allSessions = []; // { start: Date, end: Date|null, energy: number }
        let fuelEntries = []; // { date: Date, liters: number, pricePerLiter: number }
        // Schaeffler-Ladungen: eigener Strompreis als privat, daher werden die
        // Kosten direkt aus dem CSV-Export übernommen statt aus COST_PER_KWH
        // berechnet.
        let schaefflerSessions = []; // { start: Date, end: Date|null, energy: number, cost: number, location: string }
        let monthKeys = [];
        let currentMonthIndex = 0;

        const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni',
            'Juli','August','September','Oktober','November','Dezember'];
        const DAY_NAMES = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];

        // ============================================================
        // HELFER
        // ============================================================
        function parseDateTime(str) {
            if (!str) return null;
            const parts = str.trim().split(' ');
            if (parts.length < 2) return null;
            const dateParts = parts[0].split('/');
            const timeParts = parts[1].split(':');
            if (dateParts.length < 3 || timeParts.length < 2) return null;
            const year = parseInt(dateParts[0], 10);
            const month = parseInt(dateParts[1], 10) - 1;
            const day = parseInt(dateParts[2], 10);
            const hour = parseInt(timeParts[0], 10);
            const minute = parseInt(timeParts[1], 10);
            return new Date(year, month, day, hour, minute);
        }

        function formatSessionDate(date) {
            if (!date) return '';
            const dayName = DAY_NAMES[date.getDay()];
            const dayNum = date.getDate();
            const monthName = MONTH_NAMES[date.getMonth()];
            let hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            if (hours > 12) hours -= 12;
            if (hours === 0) hours = 12;
            return `${dayName} ${dayNum} ${monthName}, ${hours}:${minutes} ${ampm}`;
        }

        function formatDurationHours(hours) {
            if (!hours || hours < 0) return '0 Std. 0 Min.';
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            if (h === 0) return `${m} Min.`;
            return `${h} Std. ${m} Min.`;
        }

        function fixEnergy(val) {
            if (typeof val === 'string') val = parseFloat(val.replace(',', '.'));
            if (isNaN(val)) return 0;
            if (val > ENERGY_FIX_THRESHOLD) return Math.round((val / 10) * 1000) / 1000;
            return Math.round(val * 1000) / 1000;
        }

        function fmt(v) { return Number(v).toFixed(2); }

        function sessionDuration(s) {
            if (!s.start || !s.end) return 0;
            return (s.end.getTime() - s.start.getTime()) / 3600000;
        }

        function showToast(msg, duration = 2800) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._hide);
            el._hide = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ============================================================
        // SERIALISIERUNG (gemeinsam für localStorage, GitHub, Backup)
        // ============================================================
        function serializeSessions(sessions) {
            return sessions.map(s => ({
                start: s.start ? s.start.toISOString() : null,
                end: s.end ? s.end.toISOString() : null,
                energy: s.energy || 0,
            }));
        }

        function deserializeSessions(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .map(s => ({
                    start: s.start ? new Date(s.start) : null,
                    end: s.end ? new Date(s.end) : null,
                    energy: fixEnergy(s.energy || 0),
                }))
                .filter(s => s.start && s.energy > 0); // Nullwerte streichen
        }

        function serializeFuel(entries) {
            return entries.map(f => ({
                date: f.date ? f.date.toISOString() : null,
                liters: f.liters || 0,
                pricePerLiter: f.pricePerLiter || 0,
            }));
        }

        function deserializeFuel(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .map(f => ({
                    date: f.date ? new Date(f.date) : null,
                    liters: Math.round((parseFloat(f.liters) || 0) * 1000) / 1000,
                    pricePerLiter: Math.round((parseFloat(f.pricePerLiter) || 0) * 1000) / 1000,
                }))
                .filter(f => f.date && f.liters > 0 && f.pricePerLiter > 0);
        }

        function fuelCost(f) { return f.liters * f.pricePerLiter; }

        function serializeSchaefflerSessions(sessions) {
            return sessions.map(s => ({
                start: s.start ? s.start.toISOString() : null,
                end: s.end ? s.end.toISOString() : null,
                energy: s.energy || 0,
                cost: s.cost || 0,
                location: s.location || '',
            }));
        }

        function deserializeSchaefflerSessions(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .map(s => ({
                    start: s.start ? new Date(s.start) : null,
                    end: s.end ? new Date(s.end) : null,
                    energy: Math.round((parseFloat(s.energy) || 0) * 1000) / 1000,
                    cost: Math.round((parseFloat(s.cost) || 0) * 100) / 100,
                    location: s.location || '',
                }))
                .filter(s => s.start && s.energy > 0); // Nullwerte streichen
        }

        // ============================================================
        // PERSISTENZ (localStorage)
        // ============================================================
        function saveToLocalStorage() {
            try {
                localStorage.setItem('passat_gte_data', JSON.stringify(serializeSessions(allSessions)));
            } catch (e) { console.warn('localStorage save error', e); }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem('passat_gte_data');
                if (!raw) return false;
                allSessions = deserializeSessions(JSON.parse(raw));
                return allSessions.length > 0;
            } catch (e) { return false; }
        }

        function saveFuelToLocalStorage() {
            try {
                localStorage.setItem('passat_gte_fuel', JSON.stringify(serializeFuel(fuelEntries)));
            } catch (e) { console.warn('localStorage save error', e); }
        }

        function loadFuelFromLocalStorage() {
            try {
                const raw = localStorage.getItem('passat_gte_fuel');
                if (!raw) return false;
                fuelEntries = deserializeFuel(JSON.parse(raw));
                return fuelEntries.length > 0;
            } catch (e) { return false; }
        }

        function saveSchaefflerToLocalStorage() {
            try {
                localStorage.setItem('passat_gte_schaeffler', JSON.stringify(serializeSchaefflerSessions(schaefflerSessions)));
            } catch (e) { console.warn('localStorage save error', e); }
        }

        function loadSchaefflerFromLocalStorage() {
            try {
                const raw = localStorage.getItem('passat_gte_schaeffler');
                if (!raw) return false;
                schaefflerSessions = deserializeSchaefflerSessions(JSON.parse(raw));
                return schaefflerSessions.length > 0;
            } catch (e) { return false; }
        }

        // ============================================================
        // DATEN AUS DEM REPO LADEN (ladedaten.json / tankdaten.json /
        // schaefflerdaten.json, ohne Token)
        // ============================================================
        async function fetchJsonFile(url) {
            try {
                const resp = await fetch(url, { cache: 'no-store' });
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) {
                return null; // z.B. bei file:// ohne Server – kein Fehler nötig
            }
        }

        async function loadFromRepoJson() {
            const raw = await fetchJsonFile(DATA_URL);
            if (!raw) return false;
            return mergeSessions(deserializeSessions(raw)) > 0;
        }

        async function loadFuelFromRepoJson() {
            const raw = await fetchJsonFile(FUEL_DATA_URL);
            if (!raw) return false;
            return mergeFuelEntries(deserializeFuel(raw)) > 0;
        }

        async function loadSchaefflerFromRepoJson() {
            const raw = await fetchJsonFile(SCHAEFFLER_DATA_URL);
            if (!raw) return false;
            return mergeSchaefflerSessions(deserializeSchaefflerSessions(raw)) > 0;
        }

        // ============================================================
        // GITHUB LADEN & SPEICHERN (generisch für jede JSON-Datei im Repo)
        // ============================================================
        async function githubGetFile(path, token) {
            const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                }
            });
            if (!resp.ok) {
                if (resp.status === 404) return { notFound: true };
                throw new Error(`HTTP ${resp.status}`);
            }
            const data = await resp.json();
            const content = decodeURIComponent(escape(atob(data.content)));
            return { sha: data.sha, json: JSON.parse(content) };
        }

        async function githubPutFile(path, token, content, message) {
            let sha = null;
            try {
                const head = await githubGetFile(path, token);
                if (!head.notFound) sha = head.sha;
            } catch (e) { /* Datei existiert evtl. noch nicht */ }

            const encoded = btoa(unescape(encodeURIComponent(content)));
            const payload = { message, content: encoded, branch: 'main' };
            if (sha) payload.sha = sha;

            return fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });
        }

        async function loadFromGitHub() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) return false;

            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = '● lade...';
            statusEl.className = 'save-status sync';

            try {
                let addedTotal = 0;
                const chargeResult = await githubGetFile(GITHUB_PATH, token);
                if (!chargeResult.notFound) {
                    addedTotal += mergeSessions(deserializeSessions(chargeResult.json));
                }
                const fuelResult = await githubGetFile(FUEL_GITHUB_PATH, token);
                if (!fuelResult.notFound) {
                    addedTotal += mergeFuelEntries(deserializeFuel(fuelResult.json));
                }
                const schaefflerResult = await githubGetFile(SCHAEFFLER_GITHUB_PATH, token);
                if (!schaefflerResult.notFound) {
                    addedTotal += mergeSchaefflerSessions(deserializeSchaefflerSessions(schaefflerResult.json));
                }

                if (addedTotal > 0) {
                    updateMonthKeys();
                    currentMonthIndex = 0;
                    saveToLocalStorage();
                    saveFuelToLocalStorage();
                    saveSchaefflerToLocalStorage();
                    render();
                    statusEl.textContent = '● ✅ synchronisiert';
                    statusEl.className = 'save-status ok';
                    showToast(`✅ Daten von GitHub geladen (${allSessions.length} Sitzungen, ${fuelEntries.length} Tankfüllungen, ${schaefflerSessions.length} Schaeffler-Ladungen)`, 3000);
                } else {
                    statusEl.textContent = '● lokal aktuell';
                    statusEl.className = 'save-status ok';
                }
                return addedTotal > 0;
            } catch (e) {
                console.error(e);
                statusEl.textContent = '● ❌ Verbindung fehlgeschlagen';
                statusEl.className = 'save-status err';
                return false;
            }
        }

        async function saveToGitHub() {
            const token = document.getElementById('githubToken').value.trim();
            if (!token) {
                showToast('⚠ Bitte GitHub-Token in der Token-Zeile eingeben', 3000);
                return false;
            }

            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = '● speichern...';
            statusEl.className = 'save-status sync';

            try {
                const now = new Date().toLocaleString();
                const chargeContent = JSON.stringify(serializeSessions(allSessions), null, 2);
                const fuelContent = JSON.stringify(serializeFuel(fuelEntries), null, 2);
                const schaefflerContent = JSON.stringify(serializeSchaefflerSessions(schaefflerSessions), null, 2);

                const [chargeResp, fuelResp, schaefflerResp] = await Promise.all([
                    githubPutFile(GITHUB_PATH, token, chargeContent, `Update Ladedaten ${now}`),
                    githubPutFile(FUEL_GITHUB_PATH, token, fuelContent, `Update Tankdaten ${now}`),
                    githubPutFile(SCHAEFFLER_GITHUB_PATH, token, schaefflerContent, `Update Schaefflerdaten ${now}`),
                ]);

                if (chargeResp.ok && fuelResp.ok && schaefflerResp.ok) {
                    statusEl.textContent = '● ✅ gespeichert';
                    statusEl.className = 'save-status ok';
                    showToast('✅ Erfolgreich auf GitHub gespeichert', 2500);
                    return true;
                } else {
                    const failedResp = [chargeResp, fuelResp, schaefflerResp].find(r => !r.ok);
                    const failed = await failedResp.json();
                    console.error(failed);
                    statusEl.textContent = '● ❌ Fehler';
                    statusEl.className = 'save-status err';
                    showToast(`❌ GitHub-Fehler: ${failed.message || 'unbekannt'}`, 4000);
                    return false;
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = '● ❌ Fehler';
                statusEl.className = 'save-status err';
                showToast(`❌ Netzwerkfehler: ${e.message}`, 4000);
                return false;
            }
        }

        // ============================================================
        // DATEN LEEREN
        // ============================================================
        async function clearAllData() {
            if (!confirm('Wirklich alle Lade- und Tankdaten löschen? Dies kann nicht rückgängig gemacht werden.')) {
                return;
            }
            allSessions = [];
            fuelEntries = [];
            schaefflerSessions = [];
            monthKeys = [];
            currentMonthIndex = 0;

            localStorage.removeItem('passat_gte_fuel');
            localStorage.removeItem('passat_gte_schaeffler');
            render();
            showToast('🗑 Alle Daten wurden gelöscht', 2500);

            const token = document.getElementById('githubToken').value.trim();

        // ============================================================
        // PARSER (Import)
        // ============================================================
        function parseExcelFile(arrayBuffer) {
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

            let headerIdx = -1;
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length < 3) continue;
                for (let j = 0; j < row.length; j++) {
                    if (String(row[j] || '').includes('Start time')) { headerIdx = i; break; }
                }
                if (headerIdx >= 0) break;
            }
            if (headerIdx < 0) { showToast('⚠ Keine Kopfzeile gefunden.'); return []; }

            const sessions = [];
            const headerRow = data[headerIdx];
            let idxStart = -1, idxEnd = -1, idxEnergy = -1;
            for (let j = 0; j < headerRow.length; j++) {
                const cell = String(headerRow[j] || '').trim();
                if (cell.includes('Start time')) idxStart = j;
                else if (cell.includes('End time')) idxEnd = j;
                else if (cell.includes('Charge energy')) idxEnergy = j;
            }
            if (idxStart < 0 || idxEnergy < 0) { showToast('⚠ Spalten nicht gefunden.'); return []; }

            for (let i = headerIdx + 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                const startVal = row[idxStart] ? String(row[idxStart]).trim() : '';
                if (!startVal) continue;

                const endVal = idxEnd >= 0 && row[idxEnd] ? String(row[idxEnd]).trim() : '';
                const energyRaw = row[idxEnergy] !== undefined && row[idxEnergy] !== '' ? row[idxEnergy] : 0;
                const energy = fixEnergy(energyRaw);
                if (energy <= 0) continue; // Nullwerte streichen

                const startDate = parseDateTime(startVal);
                if (!startDate) continue;
                const endDate = endVal ? parseDateTime(endVal) : null;

                sessions.push({ start: startDate, end: endDate, energy: energy });
            }
            return sessions;
        }

        // Schaeffler-Ladeliste (WEVO-Export als CSV):
        // Datum,Zeit,Standort,Kategorie,Dauer (Minuten),kWh,Kosten,Währung
        function parseSchaefflerCsv(text) {
            const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
            if (lines.length < 2) { showToast('⚠ Keine Daten in der CSV-Datei gefunden.'); return []; }

            const header = lines[0].split(',').map(h => h.trim());
            const idx = {};
            header.forEach((h, i) => { idx[h] = i; });
            const required = ['Datum', 'Zeit', 'Dauer (Minuten)', 'kWh', 'Kosten'];
            if (required.some(col => !(col in idx))) {
                showToast('⚠ Spalten nicht gefunden (erwarte Schaeffler/WEVO-Format).');
                return [];
            }

            const sessions = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < header.length) continue;

                const dateVal = cols[idx['Datum']].trim();
                const timeVal = cols[idx['Zeit']].trim();
                if (!dateVal || !timeVal) continue;
                const [year, month, day] = dateVal.split('-').map(Number);
                const [hour, minute] = timeVal.split(':').map(Number);
                const startDate = new Date(year, month - 1, day, hour, minute);
                if (isNaN(startDate.getTime())) continue;

                const durationMin = parseFloat(cols[idx['Dauer (Minuten)']]) || 0;
                const endDate = new Date(startDate.getTime() + durationMin * 60000);
                const energy = Math.round((parseFloat(cols[idx['kWh']]) || 0) * 1000) / 1000;
                if (energy <= 0) continue; // Nullwerte streichen
                const cost = Math.round((parseFloat(cols[idx['Kosten']]) || 0) * 100) / 100;
                const location = idx['Standort'] !== undefined ? cols[idx['Standort']].trim() : '';

                sessions.push({ start: startDate, end: endDate, energy, cost, location });
            }
            return sessions;
        }

        function mergeSessions(newSessions) {
            const toAdd = [];
            for (const s of newSessions) {
                if (!s.start) continue;
                const isDuplicate = candidates => candidates.some(c =>
                    c.start && Math.abs(c.start.getTime() - s.start.getTime()) < DEDUPE_WINDOW_MS);
                if (isDuplicate(allSessions) || isDuplicate(toAdd)) continue;
                toAdd.push(s);
            }
            allSessions = [...allSessions, ...toAdd];
            allSessions.sort((a, b) => {
                if (!a.start) return 1;
                if (!b.start) return -1;
                return b.start.getTime() - a.start.getTime();
            });
            return toAdd.length;
        }

        function mergeFuelEntries(newEntries) {
            const toAdd = [];
            for (const f of newEntries) {
                if (!f.date) continue;
                const isDuplicate = candidates => candidates.some(c =>
                    c.date && Math.abs(c.date.getTime() - f.date.getTime()) < DEDUPE_WINDOW_MS &&
                    c.liters === f.liters && c.pricePerLiter === f.pricePerLiter);
                if (isDuplicate(fuelEntries) || isDuplicate(toAdd)) continue;
                toAdd.push(f);
            }
            fuelEntries = [...fuelEntries, ...toAdd];
            fuelEntries.sort((a, b) => b.date.getTime() - a.date.getTime());
            return toAdd.length;
        }

        function addFuelEntry(date, liters, pricePerLiter) {
            mergeFuelEntries([{ date, liters, pricePerLiter }]);
            updateMonthKeys();
            saveFuelToLocalStorage();
            render();
            const token = document.getElementById('githubToken').value.trim();
            if (token) setTimeout(() => saveToGitHub(), 500);
        }

        function deleteFuelEntry(index) {
            if (!confirm('Diese Tankfüllung wirklich löschen?')) return;
            fuelEntries.splice(index, 1);
            updateMonthKeys();
            saveFuelToLocalStorage();
            render();
            const token = document.getElementById('githubToken').value.trim();
            if (token) setTimeout(() => saveToGitHub(), 500);
        }

        function mergeSchaefflerSessions(newSessions) {
            const toAdd = [];
            for (const s of newSessions) {
                if (!s.start) continue;
                const isDuplicate = candidates => candidates.some(c =>
                    c.start && Math.abs(c.start.getTime() - s.start.getTime()) < DEDUPE_WINDOW_MS);
                if (isDuplicate(schaefflerSessions) || isDuplicate(toAdd)) continue;
                toAdd.push(s);
            }
            schaefflerSessions = [...schaefflerSessions, ...toAdd];
            schaefflerSessions.sort((a, b) => {
                if (!a.start) return 1;
                if (!b.start) return -1;
                return b.start.getTime() - a.start.getTime();
            });
            return toAdd.length;
        }

        // ============================================================
        // MONATSSCHLÜSSEL
        // ============================================================
        function updateMonthKeys() {
            const dates = [
                ...allSessions.map(s => s.start),
                ...fuelEntries.map(f => f.date),
                ...schaefflerSessions.map(s => s.start),
            ].filter(d => d);
            if (dates.length === 0) {
                monthKeys = [];
                return;
            }
            const minDate = new Date(Math.min(...dates.map(d => d.getTime())));
            const maxDate = new Date(Math.max(...dates.map(d => d.getTime())));
            const keys = [];
            let current = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
            const end = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
            while (current <= end) {
                keys.push(`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}`);
                current.setMonth(current.getMonth() + 1);
            }
            keys.sort((a, b) => b.localeCompare(a));
            monthKeys = keys;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const container = document.getElementById('dataContainer');
            const empty = document.getElementById('emptyState');

            if ((!allSessions.length && !fuelEntries.length && !schaefflerSessions.length) || monthKeys.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            if (currentMonthIndex >= monthKeys.length) currentMonthIndex = 0;
            if (currentMonthIndex < 0) currentMonthIndex = 0;

            const currentKey = monthKeys[currentMonthIndex];
            const [year, month] = currentKey.split('-').map(Number);
            const monthName = MONTH_NAMES[month-1];

            const monthSessions = allSessions.filter(s =>
                s.start && s.start.getFullYear() === year && s.start.getMonth() === month-1);
            const monthFuel = fuelEntries.filter(f =>
                f.date && f.date.getFullYear() === year && f.date.getMonth() === month-1);
            const monthSchaeffler = schaefflerSessions.filter(s =>
                s.start && s.start.getFullYear() === year && s.start.getMonth() === month-1);

            const daysInMonth = new Date(year, month, 0).getDate();
            const dayEnergy = new Array(daysInMonth + 1).fill(0);
            const dayFuel = new Array(daysInMonth + 1).fill(0);
            const daySchaeffler = new Array(daysInMonth + 1).fill(0);
            for (const s of monthSessions) dayEnergy[s.start.getDate()] += s.energy;
            for (const f of monthFuel) dayFuel[f.date.getDate()] += f.liters;
            for (const s of monthSchaeffler) daySchaeffler[s.start.getDate()] += s.energy;
            const maxEnergy = Math.max(0.1, ...dayEnergy);
            const maxFuel = Math.max(0.1, ...dayFuel);
            const maxSchaeffler = Math.max(0.1, ...daySchaeffler);

            const monthTotal = monthSessions.reduce((sum, s) => sum + s.energy, 0);
            const monthAvg = monthSessions.length ? monthTotal / monthSessions.length : 0;
            const monthCost = monthTotal * COST_PER_KWH;
            const monthFuelLiters = monthFuel.reduce((sum, f) => sum + f.liters, 0);
            const monthFuelCost = monthFuel.reduce((sum, f) => sum + fuelCost(f), 0);
            const monthSchaefflerEnergy = monthSchaeffler.reduce((sum, s) => sum + s.energy, 0);
            const monthSchaefflerCost = monthSchaeffler.reduce((sum, s) => sum + s.cost, 0);

            const barHeight = 90;
            let barsHtml = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const eVal = dayEnergy[d];
                const fVal = dayFuel[d];
                const sVal = daySchaeffler[d];
                const eHeight = Math.max(2, (eVal / maxEnergy) * barHeight);
                const fHeight = Math.max(2, (fVal / maxFuel) * barHeight);
                const sHeight = Math.max(2, (sVal / maxSchaeffler) * barHeight);
                const eCls = eVal > 0 ? '' : 'zero';
                const fCls = fVal > 0 ? 'fuel' : 'zero';
                const sCls = sVal > 0 ? 'schaeffler' : 'zero';
                const titleParts = [`${fmt(eVal)} kWh Zuhause`];
                if (sVal > 0) titleParts.push(`${fmt(sVal)} kWh Schaeffler`);
                if (fVal > 0) titleParts.push(`${fmt(fVal)} L getankt`);
                barsHtml += `
                    <div class="chart-day" title="${d}. ${monthName} ${year}: ${titleParts.join(', ')}">
                        <div class="chart-bar ${eCls}" style="height:${eHeight}px;"></div>
                        <div class="chart-bar ${sCls}" style="height:${sVal > 0 ? sHeight : 2}px;"></div>
                        <div class="chart-bar ${fCls}" style="height:${fVal > 0 ? fHeight : 2}px;"></div>
                    </div>
                `;
            }

            let labelsHtml = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const show = (d % 2 === 0) || d === 1 || d === daysInMonth;
                labelsHtml += `<span style="${!show ? 'visibility:hidden' : ''}">${d}</span>`;
            }

            const listItems = [
                ...monthSessions.map(s => ({ type: 'charge', date: s.start, data: s })),
                ...monthFuel.map(f => ({ type: 'fuel', date: f.date, data: f, fuelIndex: fuelEntries.indexOf(f) })),
                ...monthSchaeffler.map(s => ({ type: 'schaeffler', date: s.start, data: s })),
            ].sort((a, b) => b.date.getTime() - a.date.getTime());

            let sessionsHtml = '';
            if (listItems.length) {
                for (const item of listItems) {
                    if (item.type === 'charge') {
                        const s = item.data;
                        const dateStr = formatSessionDate(s.start);
                        const durStr = formatDurationHours(sessionDuration(s));
                        const sessionCost = s.energy * COST_PER_KWH;
                        sessionsHtml += `
                            <div class="session-item">
                                <div class="session-row1">
                                    <span class="session-date">${dateStr}</span>
                                </div>
                                <div class="session-row2">
                                    <span class="session-cost">€${fmt(sessionCost)}</span>
                                    <span class="session-duration">🕐 ${durStr}</span>
                                    <span class="session-energy">${fmt(s.energy)} <small>kWh</small></span>
                                </div>
                            </div>
                        `;
                    } else if (item.type === 'fuel') {
                        const f = item.data;
                        const dateStr = formatSessionDate(f.date);
                        sessionsHtml += `
                            <div class="session-item fuel">
                                <div class="session-row1">
                                    <span class="session-date">⛽ ${dateStr}</span>
                                    <button class="session-delete" data-fuel-index="${item.fuelIndex}" title="Löschen">✕</button>
                                </div>
                                <div class="session-row2">
                                    <span class="session-cost">€${fmt(fuelCost(f))}</span>
                                    <span class="session-duration">€${f.pricePerLiter.toFixed(3)} / L</span>
                                    <span class="session-energy">${fmt(f.liters)} <small>L</small></span>
                                </div>
                            </div>
                        `;
                    } else {
                        const s = item.data;
                        const dateStr = formatSessionDate(s.start);
                        const durStr = formatDurationHours(sessionDuration(s));
                        const pricePerKwh = s.energy > 0 ? s.cost / s.energy : 0;
                        sessionsHtml += `
                            <div class="session-item schaeffler">
                                <div class="session-row1">
                                    <span class="session-date">🏢 ${dateStr}</span>
                                </div>
                                <div class="session-row2">
                                    <span class="session-cost">€${fmt(s.cost)}</span>
                                    <span class="session-duration">🕐 ${durStr}</span>
                                    <span class="session-energy">${fmt(s.energy)} <small>kWh</small></span>
                                </div>
                                <div class="session-row3">
                                    ${s.location ? s.location + ' · ' : ''}€${pricePerKwh.toFixed(3)} / kWh
                                </div>
                            </div>
                        `;
                    }
                }
            } else {
                sessionsHtml = `<div style="padding:10px 0; color:#8a9aa8; text-align:center;">Keine Einträge in diesem Monat</div>`;
            }

            const totalEnergy = allSessions.reduce((sum, s) => sum + s.energy, 0);
            const totalCost = totalEnergy * COST_PER_KWH;
            const totalFuelLiters = fuelEntries.reduce((sum, f) => sum + f.liters, 0);
            const totalFuelCost = fuelEntries.reduce((sum, f) => sum + fuelCost(f), 0);
            const totalSchaefflerEnergy = schaefflerSessions.reduce((sum, s) => sum + s.energy, 0);
            const totalSchaefflerCost = schaefflerSessions.reduce((sum, s) => sum + s.cost, 0);
            const allDates = [
                ...allSessions.map(s => s.start),
                ...fuelEntries.map(f => f.date),
                ...schaefflerSessions.map(s => s.start),
            ].filter(d => d);
            let dateRange = '';
            if (allDates.length) {
                const minDate = new Date(Math.min(...allDates.map(d => d.getTime())));
                const maxDate = new Date(Math.max(...allDates.map(d => d.getTime())));
                dateRange = `${minDate.getDate()}. ${MONTH_NAMES[minDate.getMonth()]} ${minDate.getFullYear()} – ${maxDate.getDate()}. ${MONTH_NAMES[maxDate.getMonth()]} ${maxDate.getFullYear()}`;
            }

            container.innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">Gesamtbetrag · Gesamtzeit</div>
                    <div class="summary-row">
                        <span class="summary-total-kwh">${fmt(totalEnergy)} <small>kWh</small></span>
                        <span class="summary-cost">€${fmt(totalCost)}</span>
                    </div>
                    <div class="summary-detail">
                        <span class="status">🔵 Zuhause · ${allSessions.length} Sitzungen</span>
                        <span class="status">🏢 Schaeffler · ${fmt(totalSchaefflerEnergy)} kWh · €${fmt(totalSchaefflerCost)}</span>
                        <span class="status">⛽ ${fmt(totalFuelLiters)} L · €${fmt(totalFuelCost)}</span>
                    </div>
                    <div class="summary-date-range" style="font-size:12px;color:#8a9aa8;margin-top:4px;">${dateRange}</div>
                </div>

                <div class="month-nav-card">
                    <div class="month-nav">
                        <button class="nav-btn" id="prevMonthBtn">◀</button>
                        <span class="month-title">${monthName} <span class="year">${year}</span></span>
                        <button class="nav-btn" id="nextMonthBtn">▶</button>
                    </div>
                    <div class="month-stats">
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthTotal)}</span>
                            <span class="stat-label">kWh</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthAvg)}</span>
                            <span class="stat-label">kWh ⌀</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">€${fmt(monthCost)}</span>
                            <span class="stat-label">Kosten</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthSchaefflerEnergy)}</span>
                            <span class="stat-label">kWh 🏢</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">€${fmt(monthSchaefflerCost)}</span>
                            <span class="stat-label">Schaeffler</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthFuelLiters)}</span>
                            <span class="stat-label">L ⛽</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">€${fmt(monthFuelCost)}</span>
                            <span class="stat-label">Kraftstoff</span>
                        </span>
                    </div>
                    <div class="month-session-count">Sitzungen · ${monthName} ${year} &nbsp; ${monthSessions.length} Zuhause, ${monthSchaeffler.length} Schaeffler, ${monthFuel.length} Tankfüllungen</div>

                    <div class="chart-container">
                        <div class="chart-title">Tägliche Energie & Kraftstoff</div>
                        <div class="chart-legend">
                            <span><i class="dot energy"></i> Zuhause (kWh)</span>
                            <span><i class="dot schaeffler"></i> Schaeffler (kWh)</span>
                            <span><i class="dot fuel"></i> Tanken (L)</span>
                        </div>
                        <div class="chart-bars-wrapper">
                            <div class="chart-bars" style="height:${barHeight+20}px;">
                                ${barsHtml}
                            </div>
                        </div>
                        <div class="chart-labels">
                            ${labelsHtml}
                        </div>
                    </div>
                </div>

                <div class="session-list">
                    ${sessionsHtml}
                </div>
            `;

            document.getElementById('prevMonthBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentMonthIndex < monthKeys.length - 1) {
                    currentMonthIndex++;
                    render();
                } else {
                    showToast('Kein älterer Monat vorhanden');
                }
            });
            document.getElementById('nextMonthBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentMonthIndex > 0) {
                    currentMonthIndex--;
                    render();
                } else {
                    showToast('Sie sind bereits beim neuesten Monat');
                }
            });
            container.querySelectorAll('.session-delete[data-fuel-index]').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteFuelEntry(parseInt(this.dataset.fuelIndex, 10));
                });
            });
        }

        // ============================================================
        // IMPORT HANDLER
        // ============================================================
        function handleFiles(fileList) {
            if (!fileList || fileList.length === 0) return;
            const files = Array.from(fileList);
            let loaded = 0;
            let totalAdded = 0;

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const sessions = parseExcelFile(data);
                        totalAdded += mergeSessions(sessions);
                        loaded++;
                        if (loaded === files.length) {
                            updateMonthKeys();
                            currentMonthIndex = 0;
                            saveToLocalStorage();
                            render();
                            showToast(`✅ ${totalAdded} neue Ladevorgänge importiert (${files.length} Datei${files.length>1?'en':''})`, 3000);
                            const token = document.getElementById('githubToken').value.trim();
                            if (token) {
                                setTimeout(() => saveToGitHub(), 500);
                            }
                        }
                    } catch (err) {
                        console.error(err);
                        showToast(`❌ Fehler beim Lesen von ${file.name}`);
                        loaded++;
                        if (loaded === files.length) render();
                    }
                };
                reader.onerror = function() {
                    showToast(`❌ Fehler beim Lesen von ${file.name}`);
                    loaded++;
                    if (loaded === files.length) render();
                };
                reader.readAsArrayBuffer(file);
            }
        }

        function handleSchaefflerFiles(fileList) {
            if (!fileList || fileList.length === 0) return;
            const files = Array.from(fileList);
            let loaded = 0;
            let totalAdded = 0;

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const sessions = parseSchaefflerCsv(e.target.result);
                        totalAdded += mergeSchaefflerSessions(sessions);
                        loaded++;
                        if (loaded === files.length) {
                            updateMonthKeys();
                            currentMonthIndex = 0;
                            saveSchaefflerToLocalStorage();
                            render();
                            showToast(`✅ ${totalAdded} neue Schaeffler-Ladungen importiert (${files.length} Datei${files.length>1?'en':''})`, 3000);
                            const token = document.getElementById('githubToken').value.trim();
                            if (token) {
                                setTimeout(() => saveToGitHub(), 500);
                            }
                        }
                    } catch (err) {
                        console.error(err);
                        showToast(`❌ Fehler beim Lesen von ${file.name}`);
                        loaded++;
                        if (loaded === files.length) render();
                    }
                };
                reader.onerror = function() {
                    showToast(`❌ Fehler beim Lesen von ${file.name}`);
                    loaded++;
                    if (loaded === files.length) render();
                };
                reader.readAsText(file);
            }
        }

        // ============================================================
        // BACKUP / RESTORE
        // ============================================================
        function backupData() {
            const backup = {
                sessions: serializeSessions(allSessions),
                fuel: serializeFuel(fuelEntries),
                schaeffler: serializeSchaefflerSessions(schaefflerSessions),
            };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `passat_gte_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ Backup heruntergeladen', 2000);
        }

        function restoreData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    // Älteres Backup-Format war ein reines Array von Ladevorgängen.
                    const sessionsRaw = Array.isArray(parsed) ? parsed : (parsed.sessions || []);
                    const fuelRaw = Array.isArray(parsed) ? [] : (parsed.fuel || []);
                    const schaefflerRaw = Array.isArray(parsed) ? [] : (parsed.schaeffler || []);
                    allSessions = deserializeSessions(sessionsRaw);
                    allSessions.sort((a, b) => b.start.getTime() - a.start.getTime());
                    fuelEntries = deserializeFuel(fuelRaw);
                    fuelEntries.sort((a, b) => b.date.getTime() - a.date.getTime());
                    schaefflerSessions = deserializeSchaefflerSessions(schaefflerRaw);
                    schaefflerSessions.sort((a, b) => b.start.getTime() - a.start.getTime());
                    updateMonthKeys();
                    currentMonthIndex = 0;
                    saveToLocalStorage();
                    saveFuelToLocalStorage();
                    saveSchaefflerToLocalStorage();
                    render();
                    showToast(`✅ ${allSessions.length} Sitzungen, ${fuelEntries.length} Tankfüllungen, ${schaefflerSessions.length} Schaeffler-Ladungen wiederhergestellt`, 3000);
                    const token = document.getElementById('githubToken').value.trim();
                    if (token) {
                        setTimeout(() => saveToGitHub(), 500);
                    }
                } catch (err) {
                    showToast('❌ Fehler beim Wiederherstellen: ungültige Datei', 3000);
                }
            };
            reader.readAsText(file);
        }

        // ============================================================
        // EVENT BINDING
        // ============================================================
        const fileInput = document.getElementById('fileInput');
        document.getElementById('headerImportBtn').addEventListener('click', () => fileInput.click());
        document.getElementById('emptyImportBtn').addEventListener('click', () => fileInput.click());

        const schaefflerFileInput = document.getElementById('schaefflerFileInput');
        document.getElementById('schaefflerImportBtn').addEventListener('click', () => schaefflerFileInput.click());
        schaefflerFileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                handleSchaefflerFiles(this.files);
            }
            this.value = '';
        });

        document.getElementById('backupBtn').addEventListener('click', backupData);

        document.getElementById('restoreBtn').addEventListener('click', () => {
            document.getElementById('restoreInput').click();
        });
        document.getElementById('restoreInput').addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                restoreData(this.files[0]);
            }
            this.value = '';
        });

        document.getElementById('githubSaveBtn').addEventListener('click', saveToGitHub);
        document.getElementById('clearBtn').addEventListener('click', clearAllData);

        const fuelModal = document.getElementById('fuelModal');
        const fuelForm = document.getElementById('fuelForm');
        document.getElementById('fuelBtn').addEventListener('click', () => {
            document.getElementById('fuelDate').value = new Date().toISOString().slice(0, 10);
            document.getElementById('fuelLiters').value = '';
            document.getElementById('fuelPrice').value = '';
            fuelModal.hidden = false;
        });
        document.getElementById('fuelCancelBtn').addEventListener('click', () => { fuelModal.hidden = true; });
        fuelModal.addEventListener('click', (e) => { if (e.target === fuelModal) fuelModal.hidden = true; });
        fuelForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const dateVal = document.getElementById('fuelDate').value;
            const liters = parseFloat(document.getElementById('fuelLiters').value);
            const price = parseFloat(document.getElementById('fuelPrice').value);
            if (!dateVal || !(liters > 0) || !(price > 0)) {
                showToast('⚠ Bitte alle Felder gültig ausfüllen', 2500);
                return;
            }
            const [y, m, d] = dateVal.split('-').map(Number);
            addFuelEntry(new Date(y, m - 1, d, 12, 0), liters, price);
            fuelModal.hidden = true;
            showToast(`✅ Tankfüllung gespeichert: ${fmt(liters)} L für €${fmt(liters * price)}`, 2800);
        });

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                handleFiles(this.files);
            }
            this.value = '';
        });

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        const tokenInput = document.getElementById('githubToken');
        const savedToken = localStorage.getItem('github_token');
        if (savedToken) tokenInput.value = savedToken;

        tokenInput.addEventListener('change', function() {
            localStorage.setItem('github_token', this.value.trim());
            if (this.value.trim()) {
                setTimeout(() => loadFromGitHub(), 300);
            }
        });

        // ============================================================
        // START
        // ============================================================
        (async function init() {
            // 1. Lokalen Cache laden (schnell, offline-fähig)
            loadFromLocalStorage();
            loadFuelFromLocalStorage();
            loadSchaefflerFromLocalStorage();

            // 2. ladedaten.json / tankdaten.json / schaefflerdaten.json aus dem
            //    Repo laden – das sind die eigentlichen Datenquellen, keine
            //    Werte sind fest in der App hinterlegt.
            await loadFromRepoJson();
            await loadFuelFromRepoJson();
            await loadSchaefflerFromRepoJson();

            // 3. Falls ein GitHub-Token hinterlegt ist, zusätzlich damit
            //    abgleichen (deckt Fälle ab, in denen die JSON-Dateien per
            //    fetch() nicht erreichbar sind, z.B. beim Öffnen als lokale Datei).
            const token = tokenInput.value.trim();
            if (token) {
                await loadFromGitHub();
            }

            updateMonthKeys();
            currentMonthIndex = 0;
            saveToLocalStorage();
            saveFuelToLocalStorage();
            saveSchaefflerToLocalStorage();
            render();
            if (allSessions.length > 0 || fuelEntries.length > 0 || schaefflerSessions.length > 0) {
                showToast(`📊 ${allSessions.length} Ladevorgänge, ${schaefflerSessions.length} Schaeffler, ${fuelEntries.length} Tankfüllungen geladen`, 2500);
            }
        })();
    </script>

</body>
</html>
