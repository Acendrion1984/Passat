<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Passat GTE Ladehistorie</title>
    <!-- SheetJS for .xlsx parsing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f4f8;
            padding: 0 0 40px 0;
            min-height: 100vh;
        }
        .app-header {
            background: linear-gradient(145deg, #003d6b 0%, #0066b3 100%);
            padding: 12px 18px 10px 18px;
            box-shadow: 0 4px 20px rgba(0, 60, 120, 0.4);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left .car-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .header-left .car-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }
        .header-left .title {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }
        .header-left .title small {
            display: block;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }
        .header-actions {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-wrap: wrap;
        }
        .import-btn, .action-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: #fff;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: background 0.2s;
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
        .import-btn:hover, .action-btn:hover {
            background: rgba(255, 255, 255, 0.30);
        }
        .import-btn svg, .action-btn svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }
        .action-btn.danger {
            background: rgba(234, 67, 53, 0.35);
        }
        .action-btn.danger:hover {
            background: rgba(234, 67, 53, 0.55);
        }
        #fileInput, #restoreInput { display: none; }

        .token-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
        }
        .token-row label {
            color: rgba(255,255,255,0.7);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .token-row input {
            flex: 1;
            min-width: 120px;
            padding: 3px 8px;
            border: none;
            border-radius: 30px;
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            outline: none;
            transition: background 0.2s;
        }
        .token-row input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        .token-row input:focus {
            background: rgba(255,255,255,0.25);
        }
        .token-row .save-status {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
        }
        .token-row .save-status.ok { color: #34a853; }
        .token-row .save-status.err { color: #ea4335; }
        .token-row .save-status.sync { color: #fbbc04; }

        .summary-card {
            background: #fff;
            margin: 14px 16px 10px 16px;
            padding: 16px 18px 14px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .summary-label {
            font-size: 12px;
            font-weight: 500;
            color: #6b7a8a;
            letter-spacing: 0.2px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 2px;
        }
        .summary-total-kwh {
            font-size: 28px;
            font-weight: 700;
            color: #003d6b;
        }
        .summary-total-kwh small {
            font-size: 16px;
            font-weight: 500;
            color: #6b7a8a;
            margin-left: 4px;
        }
        .summary-cost {
            font-size: 18px;
            font-weight: 600;
            color: #003d6b;
        }
        .summary-cost small {
            font-size: 13px;
            font-weight: 400;
            color: #6b7a8a;
            margin-left: 2px;
        }
        .summary-detail {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 13px;
            color: #4a5a6a;
            border-top: 1px solid #ecf0f3;
            padding-top: 6px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .summary-detail .status { color: #6b7a8a; font-size: 11px; }

        .month-nav-card {
            background: #fff;
            margin: 0 16px 10px 16px;
            padding: 14px 18px 12px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }
        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .month-nav .nav-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #0066b3;
            cursor: pointer;
            padding: 0 10px;
            line-height: 1;
            touch-action: manipulation;
            transition: opacity 0.2s;
        }
        .month-nav .nav-btn:active { opacity: 0.5; }
        .month-nav .month-title {
            font-size: 18px;
            font-weight: 700;
            color: #003d6b;
        }
        .month-nav .month-title .year {
            font-weight: 400;
            font-size: 14px;
            color: #6b7a8a;
        }
        .month-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 2px 0;
        }
        .month-stat-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 13px;
            color: #2c3e50;
        }
        .month-stat-item .stat-value {
            font-weight: 700;
            font-size: 16px;
            color: #003d6b;
        }
        .month-stat-item .stat-label {
            color: #8a9aa8;
            font-size: 12px;
        }
        .month-session-count {
            font-size: 12px;
            color: #6b7a8a;
            margin-top: 4px;
            border-top: 1px solid #ecf0f3;
            padding-top: 6px;
        }

        .chart-container {
            margin-top: 10px;
            border-top: 1px solid #ecf0f3;
            padding-top: 10px;
        }
        .chart-title {
            font-size: 12px;
            font-weight: 500;
            color: #6b7a8a;
            margin-bottom: 4px;
            letter-spacing: 0.2px;
        }
        .chart-bars-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 4px;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            height: 90px;
            min-width: 100%;
            gap: 2px;
            flex-wrap: nowrap;
        }
        .chart-bar {
            flex: 1 0 0;
            min-width: 5px;
            border-radius: 3px 3px 0 0;
            transition: height 0.2s;
            min-height: 2px;
            position: relative;
            background: #0066b3;
        }
        .chart-bar.zero { background: #e9ecef; }
        .chart-bar:hover { opacity: 0.8; }
        .chart-labels {
            display: flex;
            margin-top: 2px;
            font-size: 7px;
            color: #8a9aa8;
            justify-content: space-between;
            padding: 0 2px;
        }
        .chart-labels span {
            flex: 1;
            text-align: center;
            transform: rotate(-45deg);
            white-space: nowrap;
            font-size: 6px;
        }

        .session-list {
            margin: 0 16px 10px 16px;
        }
        .session-item {
            background: #fff;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 6px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-left: 4px solid #0066b3;
        }
        .session-row1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-date {
            font-size: 13px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }
        .session-cost {
            font-size: 14px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-duration {
            font-size: 13px;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .session-energy {
            font-size: 14px;
            font-weight: 600;
            color: #003d6b;
        }
        .session-energy small {
            font-weight: 400;
            color: #8a9aa8;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8a9aa8;
        }
        .empty-state .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
        }
        .empty-state .hint-btn {
            margin-top: 14px;
            background: #0066b3;
            color: #fff;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2e3a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 30;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 500px) {
            .header-left .title { font-size: 14px; }
            .summary-total-kwh { font-size: 24px; }
            .summary-cost { font-size: 16px; }
            .month-nav .month-title { font-size: 16px; }
            .chart-bar { min-width: 4px; }
            .chart-labels span { font-size: 5px; }
            .header-actions .action-btn span { display: none; }
            .header-actions .action-btn { padding: 4px 8px; }
            .token-row input { min-width: 80px; font-size: 10px; }
            .token-row label { font-size: 9px; }
        }
        @media (min-width: 600px) {
            body { max-width: 480px; margin: 0 auto; background: #e8ecf0; }
        }
        ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="header-left">
                <div class="car-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
                    </svg>
                </div>
                <div class="title">
                    Passat GTE
                    <small>Ladehistorie · Zuhause</small>
                </div>
            </div>
            <div class="header-actions">
                <button class="import-btn" id="headerImportBtn">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <span>Import</span>
                </button>
                <button class="action-btn" id="backupBtn">
                    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                    <span>Backup</span>
                </button>
                <button class="action-btn" id="restoreBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                    <span>Wiederherstellen</span>
                </button>
                <button class="action-btn" id="githubSaveBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12 0 5.302 3.438 9.8 8.205 11.387.6.113.82-.26.82-.58 0-.287-.01-1.05-.015-2.06-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.3-.535-1.52.117-3.16 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.399 3-.399 1.02 0 2.04.132 3 .399 2.29-1.552 3.297-1.23 3.297-1.23.653 1.64.24 2.86.118 3.16.768.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.62-5.476 5.92.43.37.824 1.102.824 2.22 0 1.602-.015 2.894-.015 3.287 0 .322.216.698.825.578C20.565 21.795 24 17.298 24 12c0-6.627-5.373-12-12-12z"/></svg>
                    <span>GitHub</span>
                </button>
                <button class="action-btn danger" id="clearBtn">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    <span>Leeren</span>
                </button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" multiple />
                <input type="file" id="restoreInput" accept=".json" />
            </div>
        </div>

        <!-- Token-Zeile – minimal -->
        <div class="token-row">
            <label>🔑 Token</label>
            <input type="password" id="githubToken" placeholder="ghp_..." />
            <span class="save-status" id="saveStatus">● bereit</span>
        </div>
    </header>

    <div id="toast" class="toast"></div>

    <main id="appContent">
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🚗</div>
            <h3>Keine Ladedaten</h3>
            <p>Importiere eine oder mehrere <br /><strong>.xlsx</strong>-Dateien im GTE-Format.</p>
            <button class="hint-btn" id="emptyImportBtn">Datei importieren</button>
        </div>
        <div id="dataContainer"></div>
    </main>

    <script>
        // ============================================================
        // KONSTANTEN & ZUSTAND
        // ============================================================
        const COST_PER_KWH = 0.267;
        const GITHUB_REPO = 'acendrion1984/Passat';
        const GITHUB_PATH = 'ladedaten.json';
        const DATA_URL = 'ladedaten.json';
        // Werte über diesem Schwellwert (kWh) sind ein bekannter Faktor-10-
        // Messfehler des Zählers und werden durch 10 geteilt. 11.14 ist der
        // höchste beobachtete plausible Vollladewert; alles darüber (50+) sind
        // die echten Ausreißer.
        const ENERGY_FIX_THRESHOLD = 11.14;
        const DEDUPE_WINDOW_MS = 120000; // 2 Minuten

        let allSessions = []; // { start: Date, end: Date|null, energy: number }
        let monthKeys = [];
        let currentMonthIndex = 0;

        const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni',
            'Juli','August','September','Oktober','November','Dezember'];
        const DAY_NAMES = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];

        // ============================================================
        // HELFER
        // ============================================================
        function parseDateTime(str) {
            if (!str) return null;
            const parts = str.trim().split(' ');
            if (parts.length < 2) return null;
            const dateParts = parts[0].split('/');
            const timeParts = parts[1].split(':');
            if (dateParts.length < 3 || timeParts.length < 2) return null;
            const year = parseInt(dateParts[0], 10);
            const month = parseInt(dateParts[1], 10) - 1;
            const day = parseInt(dateParts[2], 10);
            const hour = parseInt(timeParts[0], 10);
            const minute = parseInt(timeParts[1], 10);
            return new Date(year, month, day, hour, minute);
        }

        function formatSessionDate(date) {
            if (!date) return '';
            const dayName = DAY_NAMES[date.getDay()];
            const dayNum = date.getDate();
            const monthName = MONTH_NAMES[date.getMonth()];
            let hours = date.getHours();
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            if (hours > 12) hours -= 12;
            if (hours === 0) hours = 12;
            return `${dayName} ${dayNum} ${monthName}, ${hours}:${minutes} ${ampm}`;
        }

        function formatDurationHours(hours) {
            if (!hours || hours < 0) return '0 Std. 0 Min.';
            const h = Math.floor(hours);
            const m = Math.round((hours - h) * 60);
            if (h === 0) return `${m} Min.`;
            return `${h} Std. ${m} Min.`;
        }

        function fixEnergy(val) {
            if (typeof val === 'string') val = parseFloat(val.replace(',', '.'));
            if (isNaN(val)) return 0;
            if (val > ENERGY_FIX_THRESHOLD) return Math.round((val / 10) * 1000) / 1000;
            return Math.round(val * 1000) / 1000;
        }

        function fmt(v) { return Number(v).toFixed(2); }

        function sessionDuration(s) {
            if (!s.start || !s.end) return 0;
            return (s.end.getTime() - s.start.getTime()) / 3600000;
        }

        function showToast(msg, duration = 2800) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._hide);
            el._hide = setTimeout(() => el.classList.remove('show'), duration);
        }

        // ============================================================
        // SERIALISIERUNG (gemeinsam für localStorage, GitHub, Backup)
        // ============================================================
        function serializeSessions(sessions) {
            return sessions.map(s => ({
                start: s.start ? s.start.toISOString() : null,
                end: s.end ? s.end.toISOString() : null,
                energy: s.energy || 0,
            }));
        }

        function deserializeSessions(raw) {
            if (!Array.isArray(raw)) return [];
            return raw
                .map(s => ({
                    start: s.start ? new Date(s.start) : null,
                    end: s.end ? new Date(s.end) : null,
                    energy: fixEnergy(s.energy || 0),
                }))
                .filter(s => s.start && s.energy > 0); // Nullwerte streichen
        }

        // ============================================================
        // PERSISTENZ (localStorage)
        // ============================================================
        function saveToLocalStorage() {
            try {
                localStorage.setItem('passat_gte_data', JSON.stringify(serializeSessions(allSessions)));
            } catch (e) { console.warn('localStorage save error', e); }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem('passat_gte_data');
                if (!raw) return false;
                allSessions = deserializeSessions(JSON.parse(raw));
                return allSessions.length > 0;
            } catch (e) { return false; }
        }

        // ============================================================
        // DATEN AUS DEM REPO LADEN (ladedaten.json, ohne Token)
        // ============================================================
        async function loadFromRepoJson() {
            try {
                const resp = await fetch(DATA_URL, { cache: 'no-store' });
                if (!resp.ok) return false;
                const sessions = deserializeSessions(await resp.json());
                const added = mergeSessions(sessions);
                return added > 0;
            } catch (e) {
                return false; // z.B. bei file:// ohne Server – kein Fehler nötig
            }
        }

        // ============================================================
        // GITHUB LADEN & SPEICHERN
        // ============================================================
        async function loadFromGitHub() {
            const tokenInput = document.getElementById('githubToken');
            const token = tokenInput.value.trim();
            if (!token) return false;

            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = '● lade...';
            statusEl.className = 'save-status sync';

            try {
                const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                    }
                });
                if (!resp.ok) {
                    if (resp.status === 404) {
                        statusEl.textContent = '● keine Daten auf GitHub';
                        statusEl.className = 'save-status';
                        return false;
                    }
                    throw new Error(`HTTP ${resp.status}`);
                }
                const data = await resp.json();
                const content = decodeURIComponent(escape(atob(data.content)));
                const newSessions = deserializeSessions(JSON.parse(content));
                const added = mergeSessions(newSessions);
                if (added > 0) {
                    updateMonthKeys();
                    currentMonthIndex = 0;
                    saveToLocalStorage();
                    render();
                    statusEl.textContent = '● ✅ synchronisiert';
                    statusEl.className = 'save-status ok';
                    showToast(`✅ Daten von GitHub geladen (${allSessions.length} Sitzungen)`, 3000);
                } else {
                    statusEl.textContent = '● lokal aktuell';
                    statusEl.className = 'save-status ok';
                }
                return added > 0;
            } catch (e) {
                console.error(e);
                statusEl.textContent = '● ❌ Verbindung fehlgeschlagen';
                statusEl.className = 'save-status err';
                return false;
            }
        }

        async function saveToGitHub() {
            const tokenInput = document.getElementById('githubToken');
            const token = tokenInput.value.trim();
            if (!token) {
                showToast('⚠ Bitte GitHub-Token in der Token-Zeile eingeben', 3000);
                return false;
            }

            const statusEl = document.getElementById('saveStatus');
            statusEl.textContent = '● speichern...';
            statusEl.className = 'save-status sync';

            try {
                const content = JSON.stringify(serializeSessions(allSessions), null, 2);
                const encoded = btoa(unescape(encodeURIComponent(content)));

                let sha = null;
                const headResp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                    }
                });
                if (headResp.ok) {
                    const headData = await headResp.json();
                    sha = headData.sha;
                }

                const payload = {
                    message: `Update Ladedaten ${new Date().toLocaleString()}`,
                    content: encoded,
                    branch: 'main'
                };
                if (sha) payload.sha = sha;

                const resp = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_PATH}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (resp.ok) {
                    statusEl.textContent = '● ✅ gespeichert';
                    statusEl.className = 'save-status ok';
                    showToast('✅ Erfolgreich auf GitHub gespeichert', 2500);
                    return true;
                } else {
                    const err = await resp.json();
                    console.error(err);
                    statusEl.textContent = '● ❌ Fehler';
                    statusEl.className = 'save-status err';
                    showToast(`❌ GitHub-Fehler: ${err.message || resp.status}`, 4000);
                    return false;
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = '● ❌ Fehler';
                statusEl.className = 'save-status err';
                showToast(`❌ Netzwerkfehler: ${e.message}`, 4000);
                return false;
            }
        }

        // ============================================================
        // DATEN LEEREN
        // ============================================================
        async function clearAllData() {
            if (!confirm('Wirklich alle Ladedaten löschen? Dies kann nicht rückgängig gemacht werden.')) {
                return;
            }
            allSessions = [];
            monthKeys = [];
            currentMonthIndex = 0;
            localStorage.removeItem('passat_gte_data');
            render();
            showToast('🗑 Alle Daten wurden gelöscht', 2500);

            const token = document.getElementById('githubToken').value.trim();
            if (token) {
                if (confirm('Auch die auf GitHub gespeicherten Daten leeren?')) {
                    await saveToGitHub();
                }
            }
        }

        // ============================================================
        // PARSER (Import)
        // ============================================================
        function parseExcelFile(arrayBuffer) {
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const data = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

            let headerIdx = -1;
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length < 3) continue;
                for (let j = 0; j < row.length; j++) {
                    if (String(row[j] || '').includes('Start time')) { headerIdx = i; break; }
                }
                if (headerIdx >= 0) break;
            }
            if (headerIdx < 0) { showToast('⚠ Keine Kopfzeile gefunden.'); return []; }

            const sessions = [];
            const headerRow = data[headerIdx];
            let idxStart = -1, idxEnd = -1, idxEnergy = -1;
            for (let j = 0; j < headerRow.length; j++) {
                const cell = String(headerRow[j] || '').trim();
                if (cell.includes('Start time')) idxStart = j;
                else if (cell.includes('End time')) idxEnd = j;
                else if (cell.includes('Charge energy')) idxEnergy = j;
            }
            if (idxStart < 0 || idxEnergy < 0) { showToast('⚠ Spalten nicht gefunden.'); return []; }

            for (let i = headerIdx + 1; i < data.length; i++) {
                const row = data[i];
                if (!row || row.length === 0) continue;
                const startVal = row[idxStart] ? String(row[idxStart]).trim() : '';
                if (!startVal) continue;

                const endVal = idxEnd >= 0 && row[idxEnd] ? String(row[idxEnd]).trim() : '';
                const energyRaw = row[idxEnergy] !== undefined && row[idxEnergy] !== '' ? row[idxEnergy] : 0;
                const energy = fixEnergy(energyRaw);
                if (energy <= 0) continue; // Nullwerte streichen

                const startDate = parseDateTime(startVal);
                if (!startDate) continue;
                const endDate = endVal ? parseDateTime(endVal) : null;

                sessions.push({ start: startDate, end: endDate, energy: energy });
            }
            return sessions;
        }

        function mergeSessions(newSessions) {
            const toAdd = [];
            for (const s of newSessions) {
                if (!s.start) continue;
                const isDuplicate = candidates => candidates.some(c =>
                    c.start && Math.abs(c.start.getTime() - s.start.getTime()) < DEDUPE_WINDOW_MS);
                if (isDuplicate(allSessions) || isDuplicate(toAdd)) continue;
                toAdd.push(s);
            }
            allSessions = [...allSessions, ...toAdd];
            allSessions.sort((a, b) => {
                if (!a.start) return 1;
                if (!b.start) return -1;
                return b.start.getTime() - a.start.getTime();
            });
            return toAdd.length;
        }

        // ============================================================
        // MONATSSCHLÜSSEL
        // ============================================================
        function updateMonthKeys() {
            const dates = allSessions.map(s => s.start).filter(d => d);
            if (dates.length === 0) {
                monthKeys = [];
                return;
            }
            const minDate = new Date(Math.min(...dates.map(d => d.getTime())));
            const maxDate = new Date(Math.max(...dates.map(d => d.getTime())));
            const keys = [];
            let current = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
            const end = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
            while (current <= end) {
                keys.push(`${current.getFullYear()}-${String(current.getMonth()+1).padStart(2,'0')}`);
                current.setMonth(current.getMonth() + 1);
            }
            keys.sort((a, b) => b.localeCompare(a));
            monthKeys = keys;
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const container = document.getElementById('dataContainer');
            const empty = document.getElementById('emptyState');

            if (!allSessions.length || monthKeys.length === 0) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            if (currentMonthIndex >= monthKeys.length) currentMonthIndex = 0;
            if (currentMonthIndex < 0) currentMonthIndex = 0;

            const currentKey = monthKeys[currentMonthIndex];
            const [year, month] = currentKey.split('-').map(Number);
            const monthName = MONTH_NAMES[month-1];

            const monthSessions = allSessions.filter(s =>
                s.start && s.start.getFullYear() === year && s.start.getMonth() === month-1);

            const daysInMonth = new Date(year, month, 0).getDate();
            const dayTotals = new Array(daysInMonth + 1).fill(0);
            for (const s of monthSessions) {
                dayTotals[s.start.getDate()] += s.energy;
            }
            const maxVal = Math.max(0.1, ...dayTotals);

            const monthTotal = monthSessions.reduce((sum, s) => sum + s.energy, 0);
            const monthAvg = monthSessions.length ? monthTotal / monthSessions.length : 0;
            const monthCost = monthTotal * COST_PER_KWH;

            const barHeight = 90;
            let barsHtml = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const val = dayTotals[d];
                const height = Math.max(2, (val / maxVal) * barHeight);
                const cls = val > 0 ? '' : 'zero';
                barsHtml += `<div class="chart-bar ${cls}" style="height:${height}px;" title="${d}. ${monthName} ${year}: ${fmt(val)} kWh"></div>`;
            }

            let labelsHtml = '';
            for (let d = 1; d <= daysInMonth; d++) {
                const show = (d % 2 === 0) || d === 1 || d === daysInMonth;
                labelsHtml += `<span style="${!show ? 'visibility:hidden' : ''}">${d}</span>`;
            }

            let sessionsHtml = '';
            if (monthSessions.length) {
                for (const s of monthSessions) {
                    const dateStr = formatSessionDate(s.start);
                    const durStr = formatDurationHours(sessionDuration(s));
                    const sessionCost = s.energy * COST_PER_KWH;
                    sessionsHtml += `
                        <div class="session-item">
                            <div class="session-row1">
                                <span class="session-date">${dateStr}</span>
                            </div>
                            <div class="session-row2">
                                <span class="session-cost">€${fmt(sessionCost)}</span>
                                <span class="session-duration">🕐 ${durStr}</span>
                                <span class="session-energy">${fmt(s.energy)} <small>kWh</small></span>
                            </div>
                        </div>
                    `;
                }
            } else {
                sessionsHtml = `<div style="padding:10px 0; color:#8a9aa8; text-align:center;">Keine Sitzungen in diesem Monat</div>`;
            }

            const totalEnergy = allSessions.reduce((sum, s) => sum + s.energy, 0);
            const totalCost = totalEnergy * COST_PER_KWH;
            const allDates = allSessions.map(s => s.start).filter(d => d);
            let dateRange = '';
            if (allDates.length) {
                const minDate = new Date(Math.min(...allDates.map(d => d.getTime())));
                const maxDate = new Date(Math.max(...allDates.map(d => d.getTime())));
                dateRange = `${minDate.getDate()}. ${MONTH_NAMES[minDate.getMonth()]} ${minDate.getFullYear()} – ${maxDate.getDate()}. ${MONTH_NAMES[maxDate.getMonth()]} ${maxDate.getFullYear()}`;
            }

            container.innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">Gesamtbetrag · Gesamtzeit</div>
                    <div class="summary-row">
                        <span class="summary-total-kwh">${fmt(totalEnergy)} <small>kWh</small></span>
                        <span class="summary-cost">€${fmt(totalCost)}</span>
                    </div>
                    <div class="summary-detail">
                        <span class="status">🔵 Zuhause · ${allSessions.length} Sitzungen</span>
                    </div>
                    <div class="summary-date-range" style="font-size:12px;color:#8a9aa8;margin-top:4px;">${dateRange}</div>
                </div>

                <div class="month-nav-card">
                    <div class="month-nav">
                        <button class="nav-btn" id="prevMonthBtn">◀</button>
                        <span class="month-title">${monthName} <span class="year">${year}</span></span>
                        <button class="nav-btn" id="nextMonthBtn">▶</button>
                    </div>
                    <div class="month-stats">
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthTotal)}</span>
                            <span class="stat-label">kWh</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">${fmt(monthAvg)}</span>
                            <span class="stat-label">kWh ⌀</span>
                        </span>
                        <span class="month-stat-item">
                            <span class="stat-value">€${fmt(monthCost)}</span>
                            <span class="stat-label">Kosten</span>
                        </span>
                    </div>
                    <div class="month-session-count">Sitzungen · ${monthName} ${year} &nbsp; ${monthSessions.length}</div>

                    <div class="chart-container">
                        <div class="chart-title">Tägliche Energie (kWh) – Zuhause</div>
                        <div class="chart-bars-wrapper">
                            <div class="chart-bars" style="height:${barHeight+20}px;">
                                ${barsHtml}
                            </div>
                        </div>
                        <div class="chart-labels">
                            ${labelsHtml}
                        </div>
                    </div>
                </div>

                <div class="session-list">
                    ${sessionsHtml}
                </div>
            `;

            document.getElementById('prevMonthBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentMonthIndex < monthKeys.length - 1) {
                    currentMonthIndex++;
                    render();
                } else {
                    showToast('Kein älterer Monat vorhanden');
                }
            });
            document.getElementById('nextMonthBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentMonthIndex > 0) {
                    currentMonthIndex--;
                    render();
                } else {
                    showToast('Sie sind bereits beim neuesten Monat');
                }
            });
        }

        // ============================================================
        // IMPORT HANDLER
        // ============================================================
        function handleFiles(fileList) {
            if (!fileList || fileList.length === 0) return;
            const files = Array.from(fileList);
            let loaded = 0;
            let totalAdded = 0;

            for (const file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const sessions = parseExcelFile(data);
                        totalAdded += mergeSessions(sessions);
                        loaded++;
                        if (loaded === files.length) {
                            updateMonthKeys();
                            currentMonthIndex = 0;
                            saveToLocalStorage();
                            render();
                            showToast(`✅ ${totalAdded} neue Ladevorgänge importiert (${files.length} Datei${files.length>1?'en':''})`, 3000);
                            const token = document.getElementById('githubToken').value.trim();
                            if (token) {
                                setTimeout(() => saveToGitHub(), 500);
                            }
                        }
                    } catch (err) {
                        console.error(err);
                        showToast(`❌ Fehler beim Lesen von ${file.name}`);
                        loaded++;
                        if (loaded === files.length) render();
                    }
                };
                reader.onerror = function() {
                    showToast(`❌ Fehler beim Lesen von ${file.name}`);
                    loaded++;
                    if (loaded === files.length) render();
                };
                reader.readAsArrayBuffer(file);
            }
        }

        // ============================================================
        // BACKUP / RESTORE
        // ============================================================
        function backupData() {
            const blob = new Blob([JSON.stringify(serializeSessions(allSessions), null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `passat_gte_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ Backup heruntergeladen', 2000);
        }

        function restoreData(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    allSessions = deserializeSessions(JSON.parse(e.target.result));
                    allSessions.sort((a, b) => b.start.getTime() - a.start.getTime());
                    updateMonthKeys();
                    currentMonthIndex = 0;
                    saveToLocalStorage();
                    render();
                    showToast(`✅ ${allSessions.length} Sitzungen wiederhergestellt`, 3000);
                    const token = document.getElementById('githubToken').value.trim();
                    if (token) {
                        setTimeout(() => saveToGitHub(), 500);
                    }
                } catch (err) {
                    showToast('❌ Fehler beim Wiederherstellen: ungültige Datei', 3000);
                }
            };
            reader.readAsText(file);
        }

        // ============================================================
        // EVENT BINDING
        // ============================================================
        const fileInput = document.getElementById('fileInput');
        document.getElementById('headerImportBtn').addEventListener('click', () => fileInput.click());
        document.getElementById('emptyImportBtn').addEventListener('click', () => fileInput.click());

        document.getElementById('backupBtn').addEventListener('click', backupData);

        document.getElementById('restoreBtn').addEventListener('click', () => {
            document.getElementById('restoreInput').click();
        });
        document.getElementById('restoreInput').addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                restoreData(this.files[0]);
            }
            this.value = '';
        });

        document.getElementById('githubSaveBtn').addEventListener('click', saveToGitHub);
        document.getElementById('clearBtn').addEventListener('click', clearAllData);

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                handleFiles(this.files);
            }
            this.value = '';
        });

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        const tokenInput = document.getElementById('githubToken');
        const savedToken = localStorage.getItem('github_token');
        if (savedToken) tokenInput.value = savedToken;

        tokenInput.addEventListener('change', function() {
            localStorage.setItem('github_token', this.value.trim());
            if (this.value.trim()) {
                setTimeout(() => loadFromGitHub(), 300);
            }
        });

        // ============================================================
        // START
        // ============================================================
        (async function init() {
            // 1. Lokalen Cache laden (schnell, offline-fähig)
            loadFromLocalStorage();

            // 2. Ladedaten.json aus dem Repo laden – das ist die eigentliche
            //    Datenquelle, keine Werte sind fest in der App hinterlegt.
            await loadFromRepoJson();

            // 3. Falls ein GitHub-Token hinterlegt ist, zusätzlich damit
            //    abgleichen (deckt Fälle ab, in denen ladedaten.json per
            //    fetch() nicht erreichbar ist, z.B. beim Öffnen als lokale Datei).
            const token = tokenInput.value.trim();
            if (token) {
                await loadFromGitHub();
            }

            updateMonthKeys();
            currentMonthIndex = 0;
            saveToLocalStorage();
            render();
            if (allSessions.length > 0) {
                showToast(`📊 ${allSessions.length} Ladevorgänge geladen`, 2500);
            }
        })();
    </script>
